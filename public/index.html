<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Support AI</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .chat-container { width: 400px; max-width: 100%; background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 600px; }
        .header { background: #0084ff; color: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 1.2rem; }
        .chat-box { flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { padding: 10px 14px; border-radius: 15px; max-width: 80%; line-height: 1.4; word-wrap: break-word; }
        .message.bot { background: #e4e6eb; align-self: flex-start; color: #050505; border-bottom-left-radius: 2px; }
        .message.user { background: #0084ff; align-self: flex-end; color: #fff; border-bottom-right-radius: 2px; }
        .input-area { padding: 15px; background: #fff; display: flex; gap: 10px; border-top: 1px solid #ddd; }
        input[type="text"] { flex-grow: 1; padding: 10px 15px; border: 1px solid #ddd; border-radius: 20px; outline: none; transition: border 0.3s; }
        input[type="text"]:focus { border-color: #0084ff; }
        button { background: #0084ff; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #006bce; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .loading { font-size: 0.8rem; color: #888; align-self: flex-start; margin-left: 10px; display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">TutoHub School Support</div>
    <div class="chat-box" id="chat-box">
        <div class="message bot">Namaste! Main TutoHub School ki support agent hoon. Main aapki kaise madad kar sakti hoon?</div>
    </div>
    <div class="loading" id="loading">Typing...</div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your message..." onkeypress="if(event.key === 'Enter') sendMessage()">
        <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    const sessionId = 'session-' + Math.random().toString(36).substring(7);

    async function sendMessage() {
        const inputField = document.getElementById('user-input');
        const text = inputField.value.trim();
        if(!text) return;

        appendMessage('user', text);
        inputField.value = '';
        document.getElementById('loading').style.display = 'block';
        document.getElementById('send-btn').disabled = true;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text, sessionId })
            });
            const data = await response.json();
            
            document.getElementById('loading').style.display = 'none';
            appendMessage('bot', data.response || "Server error.");
        } catch(e) {
            document.getElementById('loading').style.display = 'none';
            appendMessage('bot', 'Network Error. Please try again.');
        }

        document.getElementById('send-btn').disabled = false;
        inputField.focus();
    }

    function appendMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
